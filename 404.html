<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Tech Binder</title>
  <meta name="description" content="That page is not in the binder." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#08080A" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08080a;
      --panel: #0d0d11;
      --line: rgba(255, 255, 255, 0.09);
      --line-2: rgba(255, 255, 255, 0.16);
      --text: #e9eaec;
      --muted: #8f939c;
      --faint: #5d6169;
      --indigo: #6366f1;
      --font-display: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(900px 600px at 70% 10%, rgba(99, 102, 241, 0.16), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 110% 70% at 50% 0%, #000 10%, transparent 74%);
      mask-image: radial-gradient(ellipse 110% 70% at 50% 0%, #000 10%, transparent 74%);
    }
    main {
      position: relative;
      width: 100%;
      max-width: 620px;
      padding: clamp(28px, 5vw, 46px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 50px 110px -50px #000;
    }
    main::before,
    main::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-style: solid;
      border-color: var(--line-2);
    }
    main::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    main::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--indigo);
    }
    .eyebrow::before {
      content: "";
      width: 18px;
      height: 1px;
      background: currentColor;
      opacity: 0.7;
    }
    h1 {
      margin: 20px 0 16px;
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.035em;
    }
    p {
      max-width: 30rem;
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.68;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 17px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }
    .btn:hover { border-color: var(--indigo); color: var(--indigo); background: rgba(99, 102, 241, 0.1); }
    .btn.accent { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .btn.accent:hover { background: #7b7ef5; border-color: #7b7ef5; color: #fff; }
    .foot {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--faint);
    }
    :focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">404 / not in the binder</span>
    <h1>This page is missing.</h1>
    <p>
      Either it never existed, or it moved when the hardware was rebuilt. Both are
      real errors, and both are more useful than a blank screen.
    </p>
    <div class="actions">
      <a class="btn accent" href="/">Back to the binder</a>
      <a class="btn" href="https://github.com/Bamoyski">GitHub</a>
    </div>
    <div class="foot">
      <span>benmoyer.org</span>
      <span>try / instead</span>
    </div>
  </main>
</body>
</html>
