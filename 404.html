<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Ben Moyer</title>
  <meta name="description" content="Page not found." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#070a0c" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070a0c;
      --panel: #0d1216;
      --line: #1d262c;
      --text: #eef3f4;
      --muted: #93a2aa;
      --faint: #74868f;
      --accent: #7dd3dc;
      --accent-ink: #062126;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(760px 540px at 10% -10%, rgba(125, 211, 220, 0.12), transparent 62%),
        radial-gradient(900px 620px at 92% -4%, rgba(232, 199, 155, 0.05), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(147, 162, 170, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(147, 162, 170, 0.055) 1px, transparent 1px);
      background-size: 68px 68px;
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 80%);
      mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 80%);
    }
    main {
      position: relative;
      width: 100%;
      max-width: 620px;
      padding: clamp(30px, 6vw, 54px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, var(--panel), rgba(10, 14, 17, 0.92));
      box-shadow: 0 40px 100px -40px #000;
    }
    .mono {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .mono::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: 0.65; }
    h1 {
      margin: 20px 0 16px;
      font-size: clamp(2.7rem, 8vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 600;
    }
    h1 em {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    p {
      max-width: 30rem;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.65;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 0.88rem;
      font-weight: 650;
      text-decoration: none;
    }
    .btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
    .btn:hover { filter: brightness(1.06); }
    .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 34px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.04em;
      color: var(--faint);
    }
  </style>
</head>
<body>
  <main>
    <span class="mono">404 / not found</span>
    <h1>This page is <em>down.</em></h1>
    <p>Or it never existed. Either way, that's the real error — which is more than most sites will tell you.</p>
    <div class="actions">
      <a class="btn" href="/">Back home</a>
      <a class="btn ghost" href="https://github.com/Bamoyski">GitHub</a>
    </div>
    <div class="footer">
      <span>benmoyer.org</span>
      <span>try / instead</span>
    </div>
  </main>
</body>
</html>
